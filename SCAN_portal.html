<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>SCAN - Student Class Assignment Navigation</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --blue-dark: #1a3a8f;
      --blue-mid: #2457c5;
      --blue-light: #3b72f0;
      --white: #ffffff;
      --gray: #6b7280;
      --gray-light: #f3f4f6;
      --border: #d1d5db;
      --shadow: 0 4px 24px rgba(26,58,143,0.13);
      --radius: 14px;
    }
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(160deg, #dde8ff 0%, #f0f5ff 60%, #e8f0fe 100%);
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center;
    }
    header {
      width: 100%;
      background: var(--white);
      box-shadow: 0 2px 12px rgba(26,58,143,0.10);
      padding: 18px 16px 18px;
      display: flex; flex-direction: column; align-items: center; gap: 6px;
    }
    header img {
      width: 80px; height: 80px;
      object-fit: contain; border-radius: 50%;
    }
    .school-name {
      font-size: 1.15rem; font-weight: 800;
      color: var(--blue-dark);
      text-align: center; letter-spacing: 0.01em; line-height: 1.2;
    }
    .school-tagline {
      font-size: 0.72rem; color: var(--gray);
      text-align: center; font-weight: 500;
    }
    .scan-big {
      font-size: 3rem; font-weight: 900;
      color: var(--blue-dark);
      letter-spacing: 0.08em; line-height: 1;
      margin-top: 6px;
    }
    .scan-subtitle {
      font-size: 0.72rem; font-weight: 600;
      color: var(--blue-mid);
      text-align: center; letter-spacing: 0.04em;
      text-transform: uppercase; margin-top: 2px;
    }
    main {
      width: 100%; max-width: 480px;
      padding: 24px 16px 32px; flex: 1;
    }
    .card {
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 24px 20px;
    }
    .card-title {
      font-size: 1rem; font-weight: 700;
      color: var(--blue-dark);
      text-align: center; margin-bottom: 20px;
    }
    .input-group {
      display: flex; flex-direction: column;
      gap: 12px; margin-bottom: 18px;
    }
    input[type="text"] {
      width: 100%; padding: 14px 16px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-family: 'Poppins', sans-serif;
      font-size: 0.95rem; color: #1f2937;
      background: var(--gray-light);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input[type="text"]:focus {
      border-color: var(--blue-light);
      box-shadow: 0 0 0 3px rgba(59,114,240,0.13);
      background: var(--white);
    }
    input[type="text"]::placeholder { color: #adb5bd; }
    .btn-search {
      width: 100%; padding: 15px;
      background: linear-gradient(135deg, var(--blue-mid), var(--blue-light));
      color: var(--white); border: none; border-radius: 10px;
      font-family: 'Poppins', sans-serif;
      font-size: 1rem; font-weight: 700;
      cursor: pointer; letter-spacing: 0.03em;
      transition: opacity 0.2s, transform 0.1s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-search:active { transform: scale(0.98); opacity: 0.92; }
    .btn-search .dot {
      width: 8px; height: 8px;
      background: #7dd3fc; border-radius: 50%; display: inline-block;
    }

    /* MODAL OVERLAY */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(10, 25, 70, 0.55);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
      backdrop-filter: blur(2px);
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-box {
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: 0 8px 40px rgba(26,58,143,0.25);
      width: 100%;
      max-width: 420px;
      max-height: 85vh;
      overflow-y: auto;
      animation: popIn 0.25s ease;
    }
    @keyframes popIn {
      from { opacity:0; transform: scale(0.92) translateY(20px); }
      to { opacity:1; transform: scale(1) translateY(0); }
    }
    .modal-header {
      background: linear-gradient(135deg, var(--blue-dark), var(--blue-mid));
      padding: 16px 20px;
      border-radius: var(--radius) var(--radius) 0 0;
      text-align: center;
    }
    .modal-header-title {
      font-size: 0.75rem; font-weight: 700;
      color: rgba(255,255,255,0.8);
      text-transform: uppercase; letter-spacing: 0.08em;
    }
    .modal-body { padding: 20px; }

    /* Result cards inside modal */
    .result-card {
      border-left: 5px solid var(--blue-mid);
      border-radius: 10px;
      background: var(--gray-light);
      padding: 16px;
      margin-bottom: 14px;
      animation: fadeIn 0.3s ease;
    }
    .result-card:last-of-type { margin-bottom: 0; }
    .btn-map {
      display: block; margin-top: 12px;
      padding: 11px;
      background: linear-gradient(135deg, #0d9488, #14b8a6);
      color: var(--white);
      border-radius: 10px;
      text-align: center;
      font-size: 0.88rem; font-weight: 700;
      text-decoration: none;
      letter-spacing: 0.02em;
      transition: opacity 0.2s;
    }
    .btn-map:active { opacity: 0.85; }
    @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
    .result-name {
      font-size: 1rem; font-weight: 700;
      color: var(--blue-dark); margin-bottom: 12px; line-height: 1.3;
    }
    .result-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .result-item { display: flex; flex-direction: column; gap: 2px; }
    .result-item.full { grid-column: 1 / -1; }
    .result-label {
      font-size: 0.65rem; font-weight: 600;
      color: var(--blue-mid); text-transform: uppercase; letter-spacing: 0.07em;
    }
    .result-value {
      font-size: 0.88rem; font-weight: 600;
      color: #1f2937; word-break: break-word;
    }

    .modal-footer {
      padding: 16px 20px;
      border-top: 1px solid var(--border);
      display: flex; gap: 10px;
    }
    .btn-secondary {
      flex: 1; padding: 13px;
      border-radius: 10px;
      font-family: 'Poppins', sans-serif;
      font-size: 0.88rem; font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      border: none;
    }
    .btn-secondary:active { transform: scale(0.98); opacity: 0.88; }
    .btn-search-another {
      background: linear-gradient(135deg, var(--blue-mid), var(--blue-light));
      color: var(--white);
    }
    .btn-close {
      background: var(--gray-light);
      color: var(--blue-dark);
      border: 1.5px solid var(--border) !important;
    }

    /* No result modal */
    .no-result-modal {
      text-align: center; padding: 10px 0 6px;
    }
    .no-result-modal .icon { font-size: 2.5rem; margin-bottom: 10px; }
    .no-result-modal p {
      color: var(--gray); font-size: 0.9rem; font-weight: 500; line-height: 1.5;
    }

    footer {
      width: 100%;
      background: linear-gradient(90deg, var(--blue-dark), var(--blue-mid));
      color: rgba(255,255,255,0.85);
      text-align: center; padding: 14px 16px;
      font-size: 0.72rem; font-weight: 500; letter-spacing: 0.02em;
    }
    footer strong { color: var(--white); font-weight: 700; }
  </style>
</head>

  <div class="card">

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="handleOverlayClick(event)">
  <div class="modal-box" id="modalBox">
    <div class="modal-header">
      <div class="modal-header-title" id="modalHeaderTitle">Search Result</div>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer">
      <button class="btn-secondary btn-search-another" onclick="searchAnother()">Search Another</button>
      <button class="btn-secondary btn-close" onclick="closeModal()">Close</button>
    </div>
  </div>
</div>

<script>
  const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQKF4GRCiTnVK3dLhSc5cJYPWnHmE0wTusfn0uxfhnnkOCd_AeR0NHXGWOW6LZJMMjDm1-BF_1CWXYh/pub?gid=0&single=true&output=csv';
  let studentsData = [];

  async function loadData() {
    try {
      const res = await fetch(CSV_URL);
      const text = await res.text();
      const rows = text.trim().split('\n');
      const headers = rows[0].split(',').map(h => h.trim().toLowerCase().replace(/\r/g,''));
      studentsData = rows.slice(1).map(row => {
        const cols = parseCSVRow(row);
        const obj = {};
        headers.forEach((h, i) => obj[h] = (cols[i] || '').trim().replace(/\r/g,''));
        return obj;
      });
    } catch(e) { console.error('Failed to load data', e); }
  }

  function parseCSVRow(row) {
    const result = [];
    let current = '';
    let inQuotes = false;
    for (let i = 0; i < row.length; i++) {
      if (row[i] === '"') { inQuotes = !inQuotes; }
      else if (row[i] === ',' && !inQuotes) { result.push(current); current = ''; }
      else { current += row[i]; }
    }
    result.push(current);
    return result;
  }

  function normalize(str) { return str.toLowerCase().trim().replace(/\s+/g, ' '); }
  function toProperCase(str) { return str.toLowerCase().replace(/\b\w/g, c => c.toUpperCase()); }

  function showModal() { document.getElementById('modalOverlay').classList.add('active'); }
  function closeModal() { document.getElementById('modalOverlay').classList.remove('active'); }

  function handleOverlayClick(e) {
    if (e.target === document.getElementById('modalOverlay')) closeModal();
  }

  function searchStudent() {
    const fn = normalize(document.getElementById('firstName').value);
    const ln = normalize(document.getElementById('lastName').value);

    if (!fn && !ln) {
      document.getElementById('modalHeaderTitle').textContent = 'No Input';
      document.getElementById('modalBody').innerHTML = `<div class="no-result-modal"><div class="icon">⚠️</div><p>Please enter a first name or last name.</p></div>`;
      showModal();
      return;
    }

    if (studentsData.length === 0) {
      document.getElementById('modalHeaderTitle').textContent = 'Loading...';
      document.getElementById('modalBody').innerHTML = `<div class="no-result-modal"><div class="icon">⏳</div><p>Data is loading. Please try again.</p></div>`;
      showModal();
      loadData();
      return;
    }

    const matches = studentsData.filter(s => {
      const sfn = normalize(s.first_name || '');
      const sln = normalize(s.last_name || '');
      const fnMatch = !fn || sfn.includes(fn);
      const lnMatch = !ln || sln.includes(ln);
      return fnMatch && lnMatch;
    });

    if (matches.length === 0) {
      document.getElementById('modalHeaderTitle').textContent = 'Not Found';
      document.getElementById('modalBody').innerHTML = `<div class="no-result-modal"><div class="icon">🔍</div><p>No student found.<br>Please check the name and try again.</p></div>`;
      showModal();
      return;
    }

    document.getElementById('modalHeaderTitle').textContent = matches.length === 1 ? 'Student Found' : `${matches.length} Students Found`;
    document.getElementById('modalBody').innerHTML = matches.map(s => {
      const fullName = toProperCase(`${s.first_name} ${s.middle_name ? s.middle_name + ' ' : ''}${s.last_name}`);
      return `
        <div class="result-card">
          <div class="result-name">&#128100; ${fullName}</div>
          <div class="result-grid">
            <div class="result-item">
              <span class="result-label">Grade</span>
              <span class="result-value">Grade ${s.grade}</span>
            </div>
            <div class="result-item">
              <span class="result-label">Section</span>
              <span class="result-value">${toProperCase(s.section)}</span>
            </div>
            <div class="result-item full">
              <span class="result-label">Adviser</span>
              <span class="result-value">${toProperCase(s.teacher)}</span>
            </div>
            <div class="result-item">
              <span class="result-label">Room</span>
              <span class="result-value">${s.room}</span>
            </div>
          </div>
          <a href="https://108929iyes.github.io/website/school-map.html" target="_blank" class="btn-map">
            🗺️ View School Map
          </a>
        </div>`;
    }).join('');
    showModal();
  }

  function searchAnother() {
    closeModal();
    document.getElementById('firstName').value = '';
    document.getElementById('lastName').value = '';
    document.getElementById('firstName').focus();
  }

  document.addEventListener('keydown', e => { if (e.key === 'Enter') searchStudent(); });
  loadData();
</script>
</body>
</html>
